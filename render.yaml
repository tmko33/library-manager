services:
  - type: web
    name: library-manager-api
    runtime: docker
    plan: free
    healthCheckPath: /health/ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: library-manager-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["*"]'

  - type: web
    name: library-manager-web
    runtime: static
    plan: free
    buildCommand: cd frontend && npm ci --include=dev && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://library-manager-api-ueba.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: library-manager-db
    plan: free
    databaseName: library
    user: library
